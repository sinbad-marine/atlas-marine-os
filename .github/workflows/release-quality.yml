name: Release quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser-checks:
    name: Browser ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - name: Check out exact browser source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Record browser source
        run: git rev-parse HEAD
      - name: Use verified Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Install Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Run complete project on an isolated runner
        run: npm run test:web -- --project=${{ matrix.project }} --workers=1 --fail-on-flaky-tests
      - name: Preserve browser execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, shared repository pin
        with:
          name: browser-evidence-${{ github.workflow }}-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  verify:
    needs: browser-checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every browser project to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-checks.result }}
        run: test "$BROWSER_RESULT" = success
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Use verified Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Record runtime
        run: node --version
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Install locked navigation dependencies
        run: npm ci --prefix sinbad-ai-core/engines/navigation
      - name: ARGOS integrity gate
        run: npm run verify:argos
      - name: Reject vulnerable dependencies
        run: npm audit --audit-level=moderate
      - name: Reject vulnerable navigation dependencies
        run: npm audit --prefix sinbad-ai-core/engines/navigation --audit-level=moderate
      - name: Verify navigation engine release gates
        run: npm run verify --prefix sinbad-ai-core/engines/navigation
      - name: Run complete regression suite
        run: node --test sinbad-ai-core/tests/*.test.js tests/*.test.js
      - name: Record protected release source
        run: git rev-parse HEAD
      - name: Publish checked-out commit to the artifact build
        id: release_source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build allowlisted Pages artifact
        env:
          SINBAD_CHECKED_OUT_COMMIT: ${{ steps.release_source.outputs.sha }}
        run: node tools/build-pages-artifact.js .release/pages
      - name: Verify release manifest is present
        run: test -s .release/pages/release-manifest.json
      - name: Generate dependency SBOM
        working-directory: sinbad-ai-core/engines/navigation
        run: npm sbom --package-lock-only --sbom-format cyclonedx > ../../../.release/navigation-sbom.cdx.json
