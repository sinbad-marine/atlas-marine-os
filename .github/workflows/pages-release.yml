name: Controlled Pages release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact known-good commit SHA or ref to rebuild and redeploy
        required: false
        type: string

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser-checks:
    name: Browser ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - name: Check out exact browser source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.sha }}
      - name: Record browser source
        run: git rev-parse HEAD
      - name: Use verified Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Install Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Run complete project on an isolated runner
        run: npm run test:web -- --project=${{ matrix.project }} --workers=1 --fail-on-flaky-tests
      - name: Preserve browser execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, shared repository pin
        with:
          name: browser-evidence-${{ github.workflow }}-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: browser-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.sha }}
      - name: Record protected release source
        run: git rev-parse HEAD
      - name: Publish checked-out commit to the artifact build
        id: release_source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Use verified Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Install locked navigation dependencies
        run: npm ci --prefix sinbad-ai-core/engines/navigation
      - name: ARGOS integrity gate
        run: npm run verify:argos
      - name: Reject vulnerable dependencies
        run: npm audit --audit-level=moderate
      - name: Reject vulnerable navigation dependencies
        run: npm audit --prefix sinbad-ai-core/engines/navigation --audit-level=moderate
      - name: Verify navigation engine release gates
        run: npm run verify --prefix sinbad-ai-core/engines/navigation
      - name: Run complete regression suite
        run: node --test sinbad-ai-core/tests/*.test.js tests/*.test.js
      - name: Build allowlisted Pages artifact
        env:
          SINBAD_CHECKED_OUT_COMMIT: ${{ steps.release_source.outputs.sha }}
        run: node tools/build-pages-artifact.js .release/pages
      - name: Attest release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/pages/release-manifest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .release/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
