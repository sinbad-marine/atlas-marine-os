name: Controlled Pages release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use verified Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Install locked navigation dependencies
        run: npm ci --prefix sinbad-ai-core/engines/navigation
      - name: Reject vulnerable dependencies
        run: npm audit --audit-level=moderate
      - name: Reject vulnerable navigation dependencies
        run: npm audit --prefix sinbad-ai-core/engines/navigation --audit-level=moderate
      - name: Run complete regression suite
        run: node --test sinbad-ai-core/tests/*.test.js tests/*.test.js
      - name: Install Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Run desktop mobile and WCAG browser tests
        run: npm run test:web
      - name: Build allowlisted Pages artifact
        run: node tools/build-pages-artifact.js .release/pages
      - name: Attest release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/pages/release-manifest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .release/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
