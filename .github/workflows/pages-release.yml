name: Controlled Pages release

on:
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use verified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Install locked navigation dependencies
        run: npm ci --prefix sinbad-ai-core/engines/navigation
      - name: Reject vulnerable dependencies
        run: npm audit --audit-level=moderate
      - name: Reject vulnerable navigation dependencies
        run: npm audit --prefix sinbad-ai-core/engines/navigation --audit-level=moderate
      - name: Run complete regression suite
        run: node --test sinbad-ai-core/tests/*.test.js tests/*.test.js
      - name: Install Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Run desktop mobile and WCAG browser tests
        run: npm run test:web
      - name: Build allowlisted Pages artifact
        run: node tools/build-pages-artifact.js .release/pages
      - name: Attest release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/pages/release-manifest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .release/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
